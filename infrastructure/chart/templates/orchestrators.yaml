{{- include "routers.validate" . -}}
{{- range $shard := .Values.shards }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-{{ $shard }}
  labels:
    {{- include "routers.labels" $ | nindent 4 }}
    app: orchestrator-shard
    shard: "{{ $shard }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-shard
      shard: "{{ $shard }}"
  template:
    metadata:
      {{- with (include "routers.podAnnotations" (dict "root" $ "service" $.Values.orchestrator "gcsfuse" false) | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "routers.labels" $ | nindent 8 }}
        app: orchestrator-shard
        shard: "{{ $shard }}"
        {{- with $.Values.orchestrator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (include "routers.podSpecCommon" (dict "root" $ "service" $.Values.orchestrator) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: orchestrator
          image: {{ include "routers.image" (dict "registry" $.Values.image.registry "image" $.Values.orchestrator.image) | quote }}
          imagePullPolicy: {{ $.Values.orchestrator.image.pullPolicy }}
          env:
            - name: NATS
              value: {{ $.Values.infra.nats.url | quote }}
            - name: REDIS
              value: {{ $.Values.infra.valkey.url | quote }}
            - name: INBOUND_SUBJECT
              value: {{ include "routers.subject" (dict "root" $ "shard" $shard "verb" "position") | quote }}
            - name: OUTBOUND_SUBJECT
              value: {{ include "routers.subject" (dict "root" $ "shard" $shard "verb" "match") | quote }}
            - name: RESULTS_SUBJECT
              value: {{ include "routers.subject" (dict "root" $ "shard" $shard "verb" "matched") | quote }}
            - name: RUST_LOG
              value: {{ $.Values.orchestrator.rustLog | quote }}
            {{- range $name, $value := $.Values.orchestrator.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $.Values.infra.otlp.url }}
            # Spans exported here become Prometheus series via the
            # collector's spanmetrics pipeline; unset, telemetry degrades
            # to plain structured logs.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.infra.otlp.url | quote }}
            {{- end }}
            {{- with (include "routers.samplerEnv" $ | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $.Values.orchestrator.resources | nindent 12 }}
{{- end }}
