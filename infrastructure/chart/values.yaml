# Default values for routers-realtime.
# The release namespace is controlled by `helm -n <ns>`; templates use .Release.Namespace.

# One matcher deployment per geographic shard. Orchestrators are not
# geographic — they partition on vehicle id (see `orchestrator.replicas`).
# Here's a suitable default for Sydney.
shards:
  - r3gq
  - r3gr
  - r3gw
  - r3gx
  - r652
  - r658

# How many raw JetStream streams the 1024 vehicle partitions divide across,
# fleet-wide. Wire law, not a tuning knob: revisions are stream sequences,
# and remapping partitions to different streams is a migration.
streams: 4

# External infra references. Environment-specific values must be supplied via
# an overlay file (`-f values-<env>.yaml`) or `--set`; the chart intentionally
# does not ship real defaults so a bare `helm install` fails fast rather than
# silently pointing at the wrong cluster.
infra:
  nats:
    # Client connection URL used by matcher and orchestrator. Must have
    # JetStream enabled (NATS server 2.10+: the orchestrator's filtered
    # work-queue consumers need it).
    url: ""
  valkey:
    # Valkey primaries, comma-separated. Vehicles spread across them by
    # rendezvous hash, so the order carries no meaning — but every consumer
    # must be given the same set.
    url: ""
  otlp:
    # OTLP endpoint (http/protobuf) the matcher and orchestrator export
    # spans to — an opentelemetry-collector whose spanmetrics pipeline is
    # what Prometheus scrapes (see infrastructure/dev). Leave empty to
    # disable span export; the services fall back to plain logging.
    url: ""

# Shard precision passed to the matcher. Ensure shards are generated for this precision level.
shardPrecision: 4

# Source for the {shard}.shard.rt files mounted read-only into every
# matcher pod. Two modes:
#
#   mode: hostPath  → bind-mount a directory from the node filesystem.
#   mode: pvc       → mount a PersistentVolumeClaim.
#
# Override hostPath via -f or --set, if necessary.
shardCache:
  mode: hostPath
  hostPath: /var/lib/routers/shards-cache
  pvc:
    claimName: routers-shards

# Each service's `env` map is rendered verbatim into the container: keys are
# the binaries' clap-derived env names (see `--help` of each bin), so a knob
# added to a binary needs no template change to become deployable.
matcher:
  image:
    repository: routers-matcher
    tag: latest
    pullPolicy: Never
  # Matchers queue-subscribe their shard subject, so replicas divide the
  # load; scale per shard density, or let the HPA do it.
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 80
  rustLog: debug
  env:
    # Concurrent solves per matcher. Solving is CPU-bound, so this is sized
    # to actually cover the node's cores under load.
    WORKERS: "10"
  resources:
    requests:
      cpu: 1000m
      memory: 256Mi
    # No CPU limit: matching is CPU-bound (per-boundary weighing fans across
    # rayon), and a CFS cap freezes every worker and the rayon pool together
    # in 100ms throttle windows — the same stall spiral the valkey nano
    # preset caused. The request still guarantees scheduling; memory still
    # bounds the pod.
    limits:
      memory: 3072Mi

orchestrator:
  image:
    repository: routers-orchestrator
    tag: latest
    pullPolicy: Never
  # The vehicle-partitioned fleet: each pod derives a disjoint slice of the
  # 1024 partitions from its StatefulSet ordinal. Re-scaling re-slices the
  # space — do it with the fleet quiesced, or accept a short double-ownership
  # window (wasteful, not wrong: emissions dedup by revision).
  replicas: 4
  rustLog: info
  env:
    # Worker lanes per orchestrator: each vehicle is pinned to one, and a
    # lane holds through a whole solve round trip — this is the pod's
    # in-flight solve bound. Workers are tokio tasks, priced accordingly.
    WORKERS: "64"
    # History entries a vehicle's context draws from — also the resume
    # overlap horizon: a vehicle may go this many events without a committed
    # result before reconcile loses the overlap and restarts it.
    CONTEXT_WINDOW: "25"
    # Vehicles each worker keeps trip and history lanes for. The fleet-wide
    # bound is this × WORKERS per pod; size it above the concurrent vehicles
    # the pod's partitions carry, or live vehicles thrash the Valkey re-warm.
    VEHICLE_CACHE: "4096"
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      # Headroom for the per-vehicle trip and history lanes and the worker
      # channels — memory-limit reclaim stalls would masquerade as latency.
      memory: 1024Mi

grafanaDashboard:
  enabled: true
