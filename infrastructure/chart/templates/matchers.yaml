{{- include "routers.validate" . -}}
{{- range $shard := .Values.shards }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher-{{ $shard }}
  labels:
    {{- include "routers.labels" $ | nindent 4 }}
    app: matcher
    shard: "{{ $shard }}"
spec:
  # Replicas divide load: matchers queue-subscribe their shard subject, so
  # NATS delivers each request to exactly one member.
  replicas: {{ $.Values.matcher.replicas }}
  selector:
    matchLabels:
      app: matcher
      shard: "{{ $shard }}"
  template:
    metadata:
      {{- if eq $.Values.shardCache.mode "gcsfuse" }}
      annotations:
        # The CSI driver injects its sidecar only into pods carrying this
        # annotation. Without it the pod sits Pending on a volume that cannot
        # mount, and nothing in the event names the annotation as the cause.
        gke-gcsfuse/volumes: "true"
      {{- end }}
      labels:
        {{- include "routers.labels" $ | nindent 8 }}
        app: matcher
        shard: "{{ $shard }}"
    spec:
      {{- with (include "routers.podSpecCommon" (dict "root" $ "service" $.Values.matcher) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: matcher
          image: {{ include "routers.image" (dict "registry" $.Values.image.registry "image" $.Values.matcher.image) | quote }}
          imagePullPolicy: {{ $.Values.matcher.image.pullPolicy }}
          env:
            - name: NATS
              value: {{ $.Values.infra.nats.url | quote }}
            - name: DIRECTORY
              value: "/shards"
            - name: PRECISION
              value: {{ $.Values.shardPrecision | quote }}
            - name: SHARD
              value: {{ $shard | quote }}
            - name: INBOUND_SUBJECT
              value: "events.match.{{ $shard }}"
            - name: RUST_LOG
              value: {{ $.Values.matcher.rustLog | quote }}
            {{- range $name, $value := $.Values.matcher.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $.Values.infra.otlp.url }}
            # Spans exported here become Prometheus series via the
            # collector's spanmetrics pipeline; unset, telemetry degrades
            # to plain structured logs.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.infra.otlp.url | quote }}
            {{- end }}
          volumeMounts:
            - name: shards
              mountPath: /shards
              readOnly: true
          resources:
            {{- toYaml $.Values.matcher.resources | nindent 12 }}
      volumes:
        - name: shards
          {{- if eq $.Values.shardCache.mode "hostPath" }}
          hostPath:
            path: {{ $.Values.shardCache.hostPath | quote }}
            type: Directory
          {{- else if eq $.Values.shardCache.mode "pvc" }}
          persistentVolumeClaim:
            claimName: {{ $.Values.shardCache.pvc.claimName }}
          {{- else if eq $.Values.shardCache.mode "gcsfuse" }}
          {{- if not $.Values.shardCache.gcs.bucket }}
          {{- fail "shardCache.mode is 'gcsfuse' but shardCache.gcs.bucket is empty; matchers would start with an empty /shards and match nothing" }}
          {{- end }}
          # An inline CSI volume rather than a PV/PVC pair: the bucket is the
          # volume's identity, so there is nothing per-shard to provision and
          # every matcher mounts the same bucket read-only.
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: {{ $.Values.shardCache.gcs.bucket | quote }}
              mountOptions: {{ $.Values.shardCache.gcs.mountOptions | quote }}
          {{- else }}
          {{- fail (printf "shardCache.mode must be 'hostPath', 'pvc' or 'gcsfuse', got %q" $.Values.shardCache.mode) }}
          {{- end }}
{{- if $.Values.matcher.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matcher-{{ $shard }}
  labels:
    {{- include "routers.labels" $ | nindent 4 }}
    app: matcher
    shard: "{{ $shard }}"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matcher-{{ $shard }}
  minReplicas: {{ $.Values.matcher.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.matcher.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.matcher.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
