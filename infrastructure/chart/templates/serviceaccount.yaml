{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "routers.serviceAccountName" . }}
  labels:
    {{- include "routers.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # The `iam.gke.io/gcp-service-account` annotation is what binds this
  # Kubernetes identity to a GCP one. Without it the GCS FUSE mount and any
  # other Google API call fall back to the node identity, which is either
  # over-privileged or has no access to the shard bucket at all.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
