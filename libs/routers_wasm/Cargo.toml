[package]
name = "routers_wasm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "WebAssembly Component for the Routers map-matching engine"
repository = "https://github.com/routers-org/routers"
publish = false

[lib]
name = "routers_wasm"
# `cdylib` is the wasm component; `rlib` keeps the pure core testable on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The map-matching core, single-threaded: rayon can't spawn a pool on wasm, so
# `parallel` is off; `osm` for OsmNetwork::from_bytes. Path deps because Cargo
# forbids overriding an inherited dependency's default-features.
routers_transition = { path = "../routers_transition", version = "0.3.3", default-features = false }
routers_codec = { path = "../routers_codec", version = "0.2.2", default-features = false, features = ["osm"] }
# Shards + the composite network; `osm` types, no `parallel`/`web` on wasm.
routers_shard = { path = "../routers_shard", version = "0.2.3", default-features = false, features = ["osm"] }
routers_network = { workspace = true }

geo = { workspace = true }
# Generates the Rust bindings (types + `Guest`/resource traits) from wit/world.wit.
wit-bindgen = "0.46"

[dev-dependencies]
# Native end-to-end test of the pure core: build a real network from a fixture
# PBF, then match.
routers_fixtures = { workspace = true }
wkt = { workspace = true }
# `wasmtime_host` example: drive the built component from a native host.
wasmtime = "36"

[[example]]
name = "wasmtime_host"
# Pulls the wasmtime runtime; build explicitly, not part of the default set.
required-features = []

[lints]
workspace = true
