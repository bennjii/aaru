{{- include "routers.validate" . -}}
{{- range $shard := .Values.shards }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher-{{ $shard }}
  labels:
    {{- include "routers.labels" $ | nindent 4 }}
    app: matcher
    shard: "{{ $shard }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matcher
      shard: "{{ $shard }}"
  template:
    metadata:
      {{- with (include "routers.podAnnotations" (dict "root" $ "service" $.Values.matcher "gcsfuse" true) | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "routers.labels" $ | nindent 8 }}
        app: matcher
        shard: "{{ $shard }}"
        {{- with $.Values.matcher.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (include "routers.podSpecCommon" (dict "root" $ "service" $.Values.matcher) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: matcher
          image: {{ include "routers.image" (dict "registry" $.Values.image.registry "image" $.Values.matcher.image) | quote }}
          imagePullPolicy: {{ $.Values.matcher.image.pullPolicy }}
          env:
            - name: NATS
              value: {{ $.Values.infra.nats.url | quote }}
            - name: DIRECTORY
              value: "/shards"
            - name: PRECISION
              value: {{ $.Values.shardPrecision | quote }}
            - name: SHARD
              value: {{ $shard | quote }}
            - name: INBOUND_SUBJECT
              value: {{ include "routers.subject" (dict "root" $ "shard" $shard "verb" "match") | quote }}
            - name: OUTBOUND_SUBJECT
              value: {{ include "routers.subject" (dict "root" $ "shard" $shard "verb" "matched") | quote }}
            - name: RUST_LOG
              value: {{ $.Values.matcher.rustLog | quote }}
            {{- range $name, $value := $.Values.matcher.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $.Values.infra.otlp.url }}
            # Spans exported here become Prometheus series via the
            # collector's spanmetrics pipeline; unset, telemetry degrades
            # to plain structured logs.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.infra.otlp.url | quote }}
            {{- end }}
            {{- with (include "routers.samplerEnv" $ | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: shards
              mountPath: /shards
              readOnly: true
          resources:
            {{- toYaml $.Values.matcher.resources | nindent 12 }}
      volumes:
        - name: shards
          {{- if eq $.Values.shardCache.mode "hostPath" }}
          hostPath:
            path: {{ $.Values.shardCache.hostPath | quote }}
            type: Directory
          {{- else if eq $.Values.shardCache.mode "pvc" }}
          persistentVolumeClaim:
            claimName: {{ $.Values.shardCache.pvc.claimName }}
          {{- else if eq $.Values.shardCache.mode "gcsfuse" }}
          # CSI ephemeral inline volume, so the shard files are read straight
          # out of the bucket and no PersistentVolume has to be pre-created
          # per cluster or per region. Read-only, because the matcher only
          # ever loads these files.
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: {{ required "shardCache.gcs.bucket is required when shardCache.mode=gcsfuse" $.Values.shardCache.gcs.bucket | quote }}
              mountOptions: {{ $.Values.shardCache.gcs.mountOptions | quote }}
              {{- with $.Values.shardCache.gcs.onlyDir }}
              onlyDir: {{ . | quote }}
              {{- end }}
          {{- else }}
          {{- fail (printf "shardCache.mode must be 'hostPath', 'pvc' or 'gcsfuse', got %q" $.Values.shardCache.mode) }}
          {{- end }}
{{- end }}
