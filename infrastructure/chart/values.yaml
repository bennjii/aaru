# Defaults for routers-realtime. Namespace comes from `helm -n <ns>`.

# One matcher and one orchestrator per shard. A Sydney development footprint;
# a real deployment passes the generated shard list for its region.
shards:
  - r3gq
  - r3gr
  - r3gw
  - r3gx
  - r652
  - r658

# Geohash precision of `shards`, passed to the matcher's PRECISION. Must match
# the {shard}.shard.rt files, or matchers load the wrong extent.
shardPrecision: 4

# Leading geohash characters that form the cell token. Subjects are
# `<subjectPrefix>.<verb>.<cell>.<rest>`, split across two tokens because a NATS
# wildcard matches exactly one — the split is what lets one historian cover a
# cell with `<cell>.*`. Must be below shardPrecision.
cellPrecision: 2
subjectPrefix: events

# External infra. Supplied per environment via `-f values-<env>.yaml` or
# `--set`; the chart ships no defaults so a bare `helm install` fails fast
# rather than pointing at the wrong cluster.
infra:
  nats:
    # One cluster serves every cell. A core NATS server routes only to
    # subscription interest, so clustering already partitions by subject.
    url: ""
  valkey:
    # Comma-separated list of primaries. Clients place a vehicle by rendezvous
    # hash over these URLs, so the order carries no meaning.
    url: ""
  otlp:
    # OTLP http/protobuf endpoint whose spanmetrics pipeline Prometheus
    # scrapes. Empty disables span export and leaves structured logs.
    url: ""

# Source for the {shard}.shard.rt files mounted read-only into every matcher.
#
#   hostPath  bind-mount a node directory
#   pvc       mount a PersistentVolumeClaim
#   gcsfuse   mount a GCS bucket through the GKE CSI driver
#
# gcsfuse is the only one that suits a large GKE deployment: hostPath needs the
# files on every node, and a GCE persistent disk cannot attach ReadOnlyMany
# across zones.
shardCache:
  mode: hostPath
  hostPath: /var/lib/routers/shards-cache
  pvc:
    claimName: routers-shards
  gcs:
    bucket: ""
    # The caches matter more than they look: a matcher reads its whole shard
    # file at startup, so without them every restart re-reads it over the
    # network.
    mountOptions: "implicit-dirs,file-cache:max-size-mb:-1,metadata-cache:ttl-secs:-1"
    onlyDir: ""

# Prepended to every service's image.repository, so one repository/tag pair
# resolves against Artifact Registry on GKE and the local daemon in dev.
image:
  registry: ""

# Not needed for Artifact Registry, where the node service account
# authenticates.
imagePullSecrets: []

# Workload Identity. The gcsfuse CSI driver reads the bucket as this service
# account, so a gcsfuse shard cache needs it.
serviceAccount:
  create: false
  name: ""
  # Set iam.gke.io/gcp-service-account to the GCP service account to impersonate.
  annotations: {}

telemetry:
  # Rendered as OTEL_TRACES_SAMPLER and OTEL_TRACES_SAMPLER_ARG. Empty leaves
  # the SDK default, which samples everything.
  #
  # Sampling stops being optional at scale: each event produces several spans,
  # and the BatchSpanProcessor drops the excess silently from a 16k queue, so
  # the spanmetrics series under-report by an unknown factor.
  #
  # Unverified: telemetry.rs builds SdkTracerProvider without an explicit
  # sampler, so confirm opentelemetry_sdk 0.29 reads these before relying on it.
  sampleRatio: ""

# No PodDisruptionBudget is rendered, and one would not help. Matcher and
# orchestrator run a single replica per shard because their subscriptions use
# no queue group, so a PDB over one replica either blocks every drain or lets
# the only pod go.

# Each service's `env` map renders verbatim into the container. Keys are the
# binaries' clap-derived env names, so a new knob needs no template change.
matcher:
  image:
    repository: routers-matcher
    tag: latest
    pullPolicy: Never
  rustLog: debug
  env:
    # Solves are CPU-bound and fan across rayon, so this is sized to cover the
    # node's cores. Vehicles are hash-pinned, so ordering holds at any count.
    WORKERS: "10"
  resources:
    requests:
      cpu: 1000m
      memory: 256Mi
    # No CPU limit: a CFS cap freezes every worker and the rayon pool together
    # in 100ms throttle windows. The request still guarantees scheduling.
    limits:
      memory: 3072Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Worth setting: a shard's matcher is the only one there is, so an eviction
  # takes that shard offline until it reschedules and reloads its shard file.
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}

orchestrator:
  image:
    repository: routers-orchestrator
    tag: latest
    pullPolicy: Never
  rustLog: info
  env:
    # Each vehicle is pinned to one worker, so events and result-commits stay
    # ordered per vehicle while the per-event Valkey fetch — the throughput
    # bound — overlaps across vehicles. Sized against the fetch's stall tail
    # (~5% of calls stall 50-100ms, lifting the mean to ~5ms): the ceiling is
    # roughly workers / mean-fetch, so 32 holds ~6k evt/s per shard.
    WORKERS: "32"
    # History entries fetched per event, and so the resume overlap horizon: a
    # vehicle may go this many events without a committed result before
    # reconcile loses the overlap and restarts it.
    CONTEXT_WINDOW: "25"
    # Per-event matcher work budget. Contexts carrying more fresh points than
    # this restart over the newest points only, which keeps both the resume and
    # restart paths O(cap) boundaries.
    FRESH_CAP: "8"
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      # Headroom for the per-vehicle trip map and worker channels. Trips
      # accumulate over a run, and reclaim stalls would look like latency.
      memory: 1024Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}

historian:
  enabled: true
  image:
    repository: routers-historian
    tag: latest
    pullPolicy: Never

  # How historian work is divided.
  #
  #   per-cell   one Deployment per cell, on <prefix>.position.<cell>.*
  #   per-shard  one Deployment per shard, on that shard's exact subject
  #   global     one Deployment on <prefix>.position.>
  #
  # per-cell is the default and needs the two-phase subject to be expressible
  # at all. Use per-shard when one pod cannot absorb a whole cell's write rate
  # and queueGroup is unavailable.
  mode: per-cell

  # Replicas per Deployment. Above one requires queueGroup: without it every
  # replica receives every event and issues its own XADD, and the duplicates
  # consume the MAXLEN budget below and evict the real history the orchestrator
  # reads back. The chart refuses that combination.
  replicas: 1

  # Join a NATS queue group, so replicas share a subject's deliveries instead
  # of each receiving all of them. Rendered as QUEUE_GROUP, one group per
  # Deployment.
  queueGroup: false

  rustLog: debug
  env:
    # Events retained per vehicle stream (XADD MAXLEN).
    HISTORY: "25"
    # Kept small on purpose. Valkey executes commands on one thread, and a
    # 1024-command pipeline monopolises it for tens of ms — every orchestrator
    # fetch arriving meanwhile queues behind it. Smaller batches trade XADD
    # efficiency for smooth read latency.
    BATCH_SIZE: "128"
    BATCH_TIMEOUT: "20ms"
  resources:
    requests:
      cpu: 500m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}

grafanaDashboard:
  enabled: true
