name: Automated Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROTOC_VERSION: 3.20.3
  CARGO_TERM_COLOR: always
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Packager
        run: |
          cargo install --locked protoc-gen-buffa-packaging

      - name: Generate Schema
        run: |
          buf generate

      - name: Run release-plz
        uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Resolve current version
        id: version
        run: |
          set -euo pipefail

          git fetch --tags --force --quiet
          TAG=$(git tag --list 'routers-v*' --sort=-v:refname | head -n1)

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Current version: ${TAG:-none}"

  build-containers:
    name: Build and push containers
    runs-on: ubuntu-latest
    needs: release-plz-release
    if: needs.release-plz-release.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - name: orchestrator
            file: infrastructure/orchestrator/Dockerfile
          - name: matcher
            file: infrastructure/matcher/Dockerfile
          - name: timezone
            file: infrastructure/timezone/Dockerfile
      fail-fast: false
    env:
      IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/routers-${{ matrix.name }}
      TAG: ${{ needs.release-plz-release.outputs.tag }}
    steps:
      # Must precede authentication: checkout cleans the workspace that the
      # credential file is written into.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          lfs: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Check whether ${{ matrix.name }} exists at ${{ needs.release-plz-release.outputs.tag }}
        id: check
        run: |
          set -euo pipefail

          if gcloud artifacts docker tags list "$IMAGE" --format='value(tag)' | grep -Fxq "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG not found, building."
          fi

      - name: Install protoc
        if: steps.check.outputs.exists == 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}

      - name: Install Buf
        if: steps.check.outputs.exists == 'false'
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install Packager
        if: steps.check.outputs.exists == 'false'
        run: cargo install --locked protoc-gen-buffa-packaging

      - name: Generate Schema
        if: steps.check.outputs.exists == 'false'
        run: buf generate

      - name: Configure Docker for Artifact Registry
        if: steps.check.outputs.exists == 'false'
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push ${{ matrix.name }}
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.TAG }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
