{{- if .Values.serviceAccount.create }}
{{- /*
  The identity every pod runs as. Its reason for existing is Workload
  Identity: the `iam.gke.io/gcp-service-account` annotation is what lets a
  matcher read the shard bucket through the GCS FUSE CSI driver without a
  service account key. The Google-side binding is created by terraform and
  refers to this account by name, so the two must agree.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "routers.serviceAccountName" . }}
  labels:
    {{- include "routers.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
